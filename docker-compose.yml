services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crop360_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./.env.local:/app/.env.local
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - PORT=3000
    networks:
      - crop360_network

  # Optional local MongoDB container service
  mongodb:
    image: mongo:7.0
    container_name: crop360_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: agri
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crop360_network

volumes:
  mongodb_data:
    driver: local

networks:
  crop360_network:
    driver: bridge
